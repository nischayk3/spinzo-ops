name: Build Android APK (debug)

on:
  workflow_dispatch:
    inputs:
      version_code:
        description: 'Override versionCode (leave empty to auto-increment)'
        required: false
        type: string

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Setup EAS CLI
        run: npm install -g eas-cli

      - name: Versioning
        run: |
          if [ -n "${{ inputs.version_code }}" ]; then
            node -e "
              const fs = require('fs');
              const app = JSON.parse(fs.readFileSync('app.json', 'utf8'));
              app.expo.android.versionCode = parseInt('${{ inputs.version_code }}', 10);
              fs.writeFileSync('app.json', JSON.stringify(app, null, 2) + '\n');
            "
          fi

      - name: Build APK
        run: eas build --platform android --profile preview --local --non-interactive --output=app-release.apk
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: spinzo-ops-apk
          path: app-release.apk
          if-no-files-found: error

      - name: Summary
        if: always()
        run: |
          echo "### Android APK Build" >> $GITHUB_STEP_SUMMARY
          echo "- **Version:** $(node -p "require('./app.json').expo.version" || echo '?')" >> $GITHUB_STEP_SUMMARY
          echo "- **Package:** $(node -p "require('./app.json').expo.android.package" || echo '?')" >> $GITHUB_STEP_SUMMARY
          echo "- **Artifact:** \`app-release.apk\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Commit:** \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY